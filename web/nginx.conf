server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;   # plant photos
  server_tokens off;          # don't advertise the nginx version
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  # Compress text responses (pages, scripts, API JSON): much faster on slow rural mobile data.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Security headers for every response. nginx drops server-level add_header lines in any location
  # that has its own add_header, so /assets/ repeats them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # API + uploaded photos -> FastAPI backend (same origin, no CORS needed)
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;   # overwrites any value the caller sent; used for request limits
    proxy_read_timeout 180s;   # an analysis can wait on a busy model, then its fallback
    proxy_send_timeout 180s;
  }
  location /uploads/ { proxy_pass http://$api_upstream; proxy_set_header X-Real-IP $remote_addr; }
  location = /health { proxy_pass http://$api_upstream; proxy_set_header X-Real-IP $remote_addr; }
  # interactive API docs (the API port itself is not published); they load Swagger UI from a CDN,
  # so they get no Content-Security-Policy
  location = /docs { proxy_pass http://$api_upstream; }
  location = /openapi.json { proxy_pass http://$api_upstream; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  # client-side routes (/history, /analysis/123, …). The site loads nothing from other servers,
  # so the policy only allows its own files, plus data:/blob: images for photo previews.
  location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }
}
