server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;   # plant photos
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  # API + uploaded photos -> FastAPI backend (same origin, no CORS needed)
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;   # open-source models on CPU can take a while
    proxy_send_timeout 600s;
  }
  location /uploads/ { proxy_pass http://$api_upstream; }
  location = /health { proxy_pass http://$api_upstream; }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

  # client-side routes (/history, /analysis/123, …)
  location / { try_files $uri /index.html; }
}
