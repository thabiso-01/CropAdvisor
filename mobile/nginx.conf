server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /_expo/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # client-side routes (/chat, /analysis/123, …) fall back to the app shell
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
