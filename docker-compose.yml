# Crop Advisor AI — website + API + database, with Google Gemini as the AI
#   docker compose up -d --build        then open http://localhost:8080
services:
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://crop:${POSTGRES_PASSWORD:-crop_dev_password}@db:5432/crop_advisor
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-60}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-flash-lite-latest}
      GEMINI_FIRST_TIMEOUT: ${GEMINI_FIRST_TIMEOUT:-25}
      GEMINI_CHECK_MODEL: ${GEMINI_CHECK_MODEL:-gemini-flash-lite-latest}
      ANALYZE_PER_HOUR: ${ANALYZE_PER_HOUR:-30}
      CHAT_PER_HOUR: ${CHAT_PER_HOUR:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:19006}
      UPLOAD_DIR: /data/uploads
    # No published port: the website, and the phone app, reach the API through nginx on :8080,
    # which also tells the API each caller's real address for the request limits.
    expose:
      - "8000"
    volumes:
      - uploads:/data/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crop_dev_password}
      POSTGRES_DB: crop_advisor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crop -d crop_advisor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
